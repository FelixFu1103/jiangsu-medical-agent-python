services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jiangsu_medical_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jiangsu_medical_agent"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:

